name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # This job is the proof of design-spec section 8: the suite must be GREEN
  # with NO PDF oracle installed, because every oracle-backed test is gated
  # on exec.LookPath and SKIPS -- rather than fails -- when its tool is
  # missing. Pinned to ubuntu-24.04 (not ubuntu-latest) so that guarantee does
  # not silently depend on whatever image a future "latest" label resolves
  # to; recon of the 24.04 toolset confirmed none of qpdf/poppler-utils/
  # jbig2dec/imagemagick/libtiff-tools/ghostscript are preinstalled or pulled
  # in transitively, so the assertion step below is expected to pass, not a
  # no-op.
  #
  # -v on the test step is deliberate, for the same reason the sibling
  # test-oracles job gives below and with more force: without it a t.Skip() and
  # a passing test print identically, so this job -- the one where every
  # oracle-backed test is EXPECTED to skip -- cannot distinguish "the 24 oracle
  # tests skipped as designed and the rest passed" from "the suite degraded to
  # all-skips". Both show a green tick. It also means the per-test lines exist,
  # so a PASS/SKIP count from this job's log is a real number rather than an
  # inference from `ok` lines.
  test-no-oracles:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: assert no PDF oracle on PATH
        run: |
          fail=0
          # Exactly the binaries some test calls exec.LookPath on. Asserting a
          # tool no test consults buys nothing and would redden every build
          # for good the day a runner image happens to ship it, so keep this
          # list tied to the LookPath calls in the suite -- which, as of
          # byb-b3, includes pngquant and gs: both are now consulted oracles,
          # not tools deliberately left out.
          for b in qpdf pdfinfo pdftotext pdfimages pdftoppm pdffonts \
                   jbig2dec magick convert tiffdump pngquant gs jbig2; do
            if p=$(command -v "$b" 2>/dev/null); then
              echo "::error::oracle on PATH: $b -> $p"; fail=1
            fi
          done
          exit $fail
      - run: gofmt -l $(git ls-files '*.go') | tee /dev/stderr | (! read)
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -v
      - name: race-check the concurrent read path, ALONE
        # It has to run on its own. The race it guards is in pdfcpu's lazy
        # global config init, which fires on the first pdfdoc.Open in the
        # process and never again, so in the whole-package run above some
        # earlier test has already primed it and this test cannot reach the
        # racing code. Measured (byb-a5z): 10 races alone against the unfixed
        # tree, 0 races when run as part of `go test -race .`. Running it with
        # the package would pass for the wrong reason.
        #
        # CGO_ENABLED=1 for this step only: -race needs cgo, and this job pins
        # it to 0 everywhere else. That pin is the point of the job -- byblos
        # ships cgo-free, which the cross-build step below asserts -- so the
        # override stays scoped to the one command that cannot run without it.
        env:
          CGO_ENABLED: 1
        run: go test -race -count=1 -run '^TestConcurrentInspectAndExtractAreRaceFree$' .
      - name: cross-build without cgo
        run: GOOS=linux GOARCH=arm64 go build ./...
      - name: assert only permitted dependencies
        run: |
          go list -f '{{range .Imports}}{{.}}{{"\n"}}{{end}}{{range .TestImports}}{{.}}{{"\n"}}{{end}}{{range .XTestImports}}{{.}}{{"\n"}}{{end}}' ./... \
            | sort -u | grep '\.' | grep -v '^github.com/dobbo-ca/byblos' > ext.txt || true
          echo "external imports:"; cat ext.txt
          if grep -vE '^(github\.com/pdfcpu/pdfcpu(/|$)|golang\.org/x/image/(ccitt|draw|font|font/sfnt|math/fixed)(/|$))' ext.txt; then
            echo "FORBIDDEN dependency listed above. Permitted: pdfcpu, and"
            echo "golang.org/x/image/{ccitt,draw,font,font/sfnt,math/fixed} ONLY --"
            echo "x/image is allowlisted by subpackage because /bmp, /tiff and"
            echo "/webp each call image.RegisterFormat in init(), which would"
            echo "widen what image.Decode accepts on the classification path"
            echo "(byb-1tj). font, font/sfnt and math/fixed register nothing"
            echo "(checked for byb-8b9.3 and byb-8b9.7; see imagecodecs_arch_test.go)."
            exit 1
          fi

  # This job installs every oracle the suite knows how to use and runs the
  # WHOLE suite -- not a package path, not a -run filter. The job it replaces
  # ran `go test ./internal/jbig2/ -run "TestRoundTrip|TestBeats|TestPDF"`,
  # which covered 4 of the 24 oracle-backed tests; the other 20 depended on
  # the sibling job happening to install qpdf and poppler-utils for its own
  # reasons. Coverage that arrives as a side effect of another job's needs is
  # coverage that leaves the same way. A widened regex was considered and
  # rejected -- it silently stops covering whatever test is added next, which
  # is how this gap appeared in the first place. -v is deliberate too: without
  # it a t.Skip() and a passing test print identically in the log, so this job
  # could quietly degrade to all-skips and still show a green tick.
  test-oracles:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: install test oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf poppler-utils \
            jbig2dec imagemagick libtiff-tools pngquant ghostscript jbig2
      - name: assert the oracles are on PATH
        # A missing binary makes the corresponding test t.Skip, which would
        # turn this whole job into a silent no-op. Fail here instead, loudly.
        run: |
          for t in qpdf pdfinfo pdftotext pdfimages pdftoppm pdffonts \
                   jbig2dec tiffdump pngquant gs jbig2; do
            command -v "$t" >/dev/null || { echo "MISSING oracle: $t"; exit 1; }
          done
          command -v magick >/dev/null || command -v convert >/dev/null || { echo "MISSING oracle: magick/convert"; exit 1; }
          qpdf --version
      - run: go test ./... -v
